services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-rag-postgres

    environment:
      POSTGRES_DB: knowledge_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: